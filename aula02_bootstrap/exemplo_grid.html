<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container">
        <div class="container-sm bg-primary-subtle">100% wide until small breakpoint</div> <!-- para dispositivos pequenos // para cor de fundo: bg-primary-subtle -->
        <div class="container-md bg-primary-subtle">100% wide until medium breakpoint</div>
        <div class="container-lg bg-primary-subtle">100% wide until large breakpoint</div>
        <div class="container-xl bg-primary-subtle">100% wide until extra large breakpoint</div>
        <div class="container-xxl bg-primary-subtle">100% wide until extra extra large breakpoint</div>
        <div class="container-fluide bg-primary-subtle">100% fluide</div>
    </div>

    <div class="container text-center">
        <div class="row">
            <div class="col">
                Column 1
            </div>
            <div class="col">
                Column 2
            </div>
            <div class="col">
                Column 3
            </div>
        </div>
    </div>

    <h1>Hello, World</h1>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script></body>
</html>
