<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Categorias</h1>

    <!-- Formulário -->
    <form id="formCategory">
      <input type="hidden" id="idCat">
      <div class="input-group flex-nowrap">
        <span class="input-group-text" id="form-control">
          Nome: 
        </span>
        <input type="text" id="txtName" class="form-control" placeholder="Digite o nome da categoria">
      </div>
    </form>

    <!-- Informativos -->
    <table class="table table-striped table-hover" id="tbl_dados">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaCategorias"></tbody>
    </table>

    <br>
    <h1>Produtos</h1>

    <!-- Formulário -->
    <form id="formProduct" class="mb-3">
      <input type="hidden" id="idProd">
      <div class="input-group mb-2">
        <span class="input-group-text">Nome: </span>
        <input type="text" id="txtNameProd" class="form-control" placeholder="Digite o nome do produto" required>
      </div>
      <div class="input-group mb-2">
        <span class="input-group-text">Preço: </span>
        <input type="number" id="txtPrice" class="form-control" placeholder="0,00" min="0" step="0.01">
      </div>
      <div class="input-group mb-2">
        <span class="input-group-text">Categoria: </span>
        <select id="selCategory" class="form-select"></select>
      </div>
      <button type="submit" class="btn btn-success">Salvar</button>
      <button type="button" class="btn btn-secondary" onclick="clearFormProduct()">Cancelar</button>
    </form>

    <!-- Informativos -->
    <table class="table table-striped table-hover" id="tbl_produtos">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
    </table>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
